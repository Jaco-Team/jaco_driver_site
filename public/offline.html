<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#dc0036" />
    <title>Нет подключения к интернету</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        background: #f3f6fa;
        color: #24313f;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
      }

      main {
        width: min(90%, 420px);
        padding: 28px;
        border: 1px solid #dce3e9;
        border-radius: 20px;
        background: #fff;
        box-shadow: 0 12px 32px rgb(25 38 50 / 10%);
        text-align: center;
      }

      h1 {
        margin: 0 0 10px;
        font-size: 22px;
      }

      p {
        margin: 0;
        color: #657587;
        line-height: 1.45;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Нет подключения к интернету</h1>
      <p>Этот экран ещё не сохранён. Подключитесь к сети и один раз обновите приложение.</p>
    </main>
  </body>
</html>
