services:
  app:
    build:
      context: .
      target: runner
    image: jaco-driver-site:latest
    ports:
      - "${APP_PORT:-3225}:3225"
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: 3225
      HOSTNAME: 0.0.0.0
      NEXT_TELEMETRY_DISABLED: 1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  app-dev:
    build:
      context: .
      target: dev
    profiles:
      - dev
    ports:
      - "${APP_PORT:-3225}:3225"
    env_file:
      - .env.development
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: 1
      WATCHPACK_POLLING: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev -- --hostname 0.0.0.0
