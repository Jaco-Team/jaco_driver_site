services:
  driver-frontend-new:
    environment:
      YANDEX_TILES_API_KEY: ${YANDEX_TILES_API_KEY:?Set the YANDEX_TILES_API_KEY Actions secret for deployment}
    read_only: true
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,uid=1001,gid=65533,size=64m
      - /app/.next/cache:rw,nosuid,nodev,uid=1001,gid=65533,size=256m
