name: Build and Deploy Frontend API Laravel

on:
  push:
    branches:
      - api-laravel
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/jaco-team/jaco-driver-frontend:api-laravel

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_YANDEX_MAPS_API_KEY: ${{ secrets.NEXT_PUBLIC_YANDEX_MAPS_API_KEY || vars.NEXT_PUBLIC_YANDEX_MAPS_API_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check frontend build configuration
        env:
          AUTO_DEPLOY_FRONTEND: ${{ vars.AUTO_DEPLOY_FRONTEND }}
          YANDEX_TILES_API_KEY: ${{ secrets.YANDEX_TILES_API_KEY }}
        shell: bash
        run: |
          if [[ -z "${NEXT_PUBLIC_YANDEX_MAPS_API_KEY//[[:space:]]/}" ]]; then
            echo "::error::NEXT_PUBLIC_YANDEX_MAPS_API_KEY is missing. Set it in repository Settings > Secrets and variables > Actions (secret or variable). This job does not use environment secrets; local .env.production.local is excluded from the Docker image."
            exit 1
          fi
          tiles_key="${YANDEX_TILES_API_KEY//[[:space:]]/}"
          if [[ "$AUTO_DEPLOY_FRONTEND" == 'true' && ${#tiles_key} -lt 20 ]]; then
            echo "::error::YANDEX_TILES_API_KEY is missing or too short. Set a repository Actions secret for the runtime offline map API before deploying."
            exit 1
          fi

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build frontend image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_ORIGIN=https://apidriver.jacochef.ru \
            --build-arg NEXT_PUBLIC_API_URL=https://apidriver.jacochef.ru \
            --build-arg NEXT_PUBLIC_LEGACY_API_ORIGIN=https://apidriver.jacochef.ru \
            --build-arg NEXT_PUBLIC_MEDIA_ORIGIN=https://apidriver.jacochef.ru \
            --build-arg NEXT_PUBLIC_YANDEX_METRIKA_ID="${{ secrets.NEXT_PUBLIC_YANDEX_METRIKA_ID }}" \
            --build-arg NEXT_PUBLIC_YANDEX_MAPS_API_KEY \
            --build-arg NEXT_PUBLIC_SENTRY_DSN="${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}" \
            --build-arg NEXT_PUBLIC_SMARTCAPTCHA_CLIENT_KEY="${{ secrets.NEXT_PUBLIC_SMARTCAPTCHA_CLIENT_KEY }}" \
            -t $IMAGE_NAME .

      - name: Push frontend image
        run: docker push $IMAGE_NAME

      - name: Upload frontend runtime security policy
        if: ${{ vars.AUTO_DEPLOY_FRONTEND == 'true' }}
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: deploy/docker-compose.security.yml
          target: /home/deploy/deploy/driver-frontend
          strip_components: 1
          overwrite: true

      - name: Deploy frontend over SSH
        if: ${{ vars.AUTO_DEPLOY_FRONTEND == 'true' }}
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          YANDEX_TILES_API_KEY: ${{ secrets.YANDEX_TILES_API_KEY }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: YANDEX_TILES_API_KEY
          script: |
            set -eu
            cd /home/deploy/deploy/driver-frontend

            docker compose \
              -f docker-compose.yml \
              -f docker-compose.security.yml \
              config --quiet
            docker compose \
              -f docker-compose.yml \
              -f docker-compose.security.yml \
              pull
            docker compose \
              -f docker-compose.yml \
              -f docker-compose.security.yml \
              up -d

            docker ps --filter "name=driver-frontend-new"
