name: Build Frontend

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/jaco-team/jaco-driver-frontend:main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_URL=https://apidriver.jacochef.ru \
            -t $IMAGE_NAME .

      - name: Push image
        run: docker push $IMAGE_NAME