# Application env is sourced by the controller from OpenBao.
# The scoped Sentry upload token is a CI-only secret mounted by BuildKit.
name: Driver Frontend Publish
on:
  push:
    branches: [api-laravel]
  pull_request:
    branches: [api-laravel]
  workflow_dispatch:
    inputs:
      source_sha:
        type: string
        required: true
      public_config_json:
        type: string
        required: true
      public_config_sha256:
        type: string
        required: true
      public_config_version:
        type: string
        required: true
      build_request_id:
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: driver-frontend-publish-${{ github.ref }}
  cancel-in-progress: false
env:
  IMAGE_REPOSITORY: ghcr.io/jaco-team/jaco-driver-frontend
  SOURCE_SHA: ${{ inputs.source_sha }}
  PUBLIC_CONFIG_JSON: ${{ inputs.public_config_json }}
  PUBLIC_CONFIG_SHA256: ${{ inputs.public_config_sha256 }}
  PUBLIC_CONFIG_VERSION: ${{ inputs.public_config_version }}
  BUILD_REQUEST_ID: ${{ inputs.build_request_id }}
  DISPATCH_WORKFLOW_SHA: ${{ github.workflow_sha }}
jobs:
  required_checks:
    name: Frontend required checks
    permissions:
      contents: read
    uses: Jaco-Team/jaco_driver_site/.github/workflows/frontend-checks.yml@aaf27418731c6b917d3a4f64d9b7f841c8ba2e0b
  publish:
    name: Publish frontend image and metadata
    needs: required_checks
    if: github.event_name == 'workflow_dispatch' && github.actor_id == '341564021' && github.ref == 'refs/heads/api-laravel' && github.sha == inputs.source_sha && needs.required_checks.result == 'success'
    runs-on:
      group: driver-frontend-publish
      labels: jaco-driver-front-publish
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Apply the context guard in the fresh publication checkout
        run: python3 .github/scripts/jaco-driver/prepare-build-context.py --dockerfile Dockerfile
      - name: Validate the pinned public snapshot and write public runner env
        run: python3 .github/scripts/jaco-driver/prepare-public-build.py
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Require the scoped Sentry upload credential without printing it
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: test -n "$SENTRY_AUTH_TOKEN" || { echo 'SENTRY_UPLOAD_CREDENTIAL_MISSING' >&2; exit 1; }
      - name: Build and publish with validated public snapshot and public release metadata
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          target: runner
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_REPOSITORY }}:sha-${{ github.sha }}
            ${{ env.IMAGE_REPOSITORY }}:run-${{ github.run_id }}-${{ github.run_attempt }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            io.jaco.driver.public-config-sha256=${{ env.VALIDATED_PUBLIC_CONFIG_SHA256 }}
          build-args: |
            NEXT_PUBLIC_API_ORIGIN=${{ env.NEXT_PUBLIC_API_ORIGIN }}
            NEXT_PUBLIC_API_URL=${{ env.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_LEGACY_API_ORIGIN=${{ env.NEXT_PUBLIC_LEGACY_API_ORIGIN }}
            NEXT_PUBLIC_MEDIA_ORIGIN=${{ env.NEXT_PUBLIC_MEDIA_ORIGIN }}
            NEXT_PUBLIC_YANDEX_METRIKA_ID=${{ env.NEXT_PUBLIC_YANDEX_METRIKA_ID }}
            NEXT_PUBLIC_YANDEX_MAPS_API_KEY=${{ env.NEXT_PUBLIC_YANDEX_MAPS_API_KEY }}
            NEXT_PUBLIC_SENTRY_DSN=${{ env.NEXT_PUBLIC_SENTRY_DSN }}
            NEXT_PUBLIC_SMARTCAPTCHA_CLIENT_KEY=${{ env.NEXT_PUBLIC_SMARTCAPTCHA_CLIENT_KEY }}
            SENTRY_RELEASE=jaco-driver-frontend@${{ github.sha }}
            SENTRY_ORG=${{ vars.SENTRY_ORG || 'sentry' }}
            SENTRY_PROJECT=${{ vars.SENTRY_PROJECT || 'javascript-react' }}
            SENTRY_UPLOAD_SOURCEMAPS=1
            SENTRY_SET_COMMITS=${{ vars.SENTRY_SET_COMMITS || '0' }}
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
          provenance: mode=min
          sbom: true
          cache-from: type=gha,scope=driver-frontend-production
          cache-to: type=gha,mode=max,scope=driver-frontend-production
      - name: Write digest, commit, build request and config version evidence
        env:
          COMPONENT: frontend
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          REQUIRED_CHECKS_RESULT: ${{ needs.required_checks.result }}
        run: python3 .github/scripts/jaco-driver/write-release-metadata.py
      - name: Publish only component metadata for the controller
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-metadata
          path: jaco-release-metadata/component.json
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 30
