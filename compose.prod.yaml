services:
  frontend:
    build:
      context: .
      target: runner
      args:
        NEXT_PUBLIC_API_ORIGIN: ${NEXT_PUBLIC_API_ORIGIN:-https://apidriver.jacochef.ru}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://apidriver.jacochef.ru}
        NEXT_PUBLIC_LEGACY_API_ORIGIN: ${NEXT_PUBLIC_LEGACY_API_ORIGIN:-https://apidriver.jacochef.ru}
        NEXT_PUBLIC_MEDIA_ORIGIN: ${NEXT_PUBLIC_MEDIA_ORIGIN:-https://jacochef.ru}
        NEXT_PUBLIC_YANDEX_METRIKA_ID: ${NEXT_PUBLIC_YANDEX_METRIKA_ID:-}
        NEXT_PUBLIC_YANDEX_MAPS_API_KEY: ${NEXT_PUBLIC_YANDEX_MAPS_API_KEY:-}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
        NEXT_PUBLIC_SMARTCAPTCHA_CLIENT_KEY: ${NEXT_PUBLIC_SMARTCAPTCHA_CLIENT_KEY:-}
    image: jaco/driver-site:prod
    restart: unless-stopped
    env_file:
      - "${PROD_ENV_FILE:-.env.production}"
      - path: .env.production.local
        required: false
    environment:
      NODE_ENV: production
      PORT: 3225
      HOSTNAME: 0.0.0.0
      NEXT_TELEMETRY_DISABLED: 1
    expose:
      - "3225"
    networks:
      jaco-prod:
        aliases:
          - frontend

networks:
  jaco-prod:
    external: true
